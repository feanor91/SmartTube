name: Desktop Windows build

on:
  push:
    branches: [ 'claude/gifted-mccarthy-0aq2k3' ]
    paths: [ 'desktop/**', '.github/workflows/desktop-windows.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - shell: bash
        run: npx electron-builder --win zip --x64 -c.win.signAndEditExecutable=true
      - uses: actions/upload-artifact@v4
        with:
          name: SmartTube-Windows
          path: desktop/dist/SmartTube-*-win.zip
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release delete "desktop-v$VERSION" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create "desktop-v$VERSION" dist/SmartTube-*-win.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "SmartTube Desktop $VERSION (Windows)" \
            --notes "Version Windows (Electron). Téléchargez le zip, extrayez-le entièrement, puis lancez SmartTube.exe."
